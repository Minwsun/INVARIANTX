[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariantx-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2,<3",
  "google-genai>=2.9,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
