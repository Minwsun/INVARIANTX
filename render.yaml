services:
  - type: web
    name: invariantx-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: INVARIANT_STORE
        value: firestore
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INVARIANT_INTENT_MODEL
        value: gemini-3.5-flash-lite
      - key: INVARIANT_PLANNER_MODEL
        value: gemma-4-31b-it
      - key: INVARIANT_WORKER_MODEL
        value: gemma-4-31b-it
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INVARIANT_DEMO_KEY
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: ^https://invariantx-web(?:-[a-z0-9-]+)?\.onrender\.com$

  - type: web
    name: invariantx-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          name: invariantx-api
          type: web
          property: host
