name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-firestore-emulator
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start \
            --project=invariantx-test \
            --host-port=127.0.0.1:8085 \
            >/tmp/firestore.log 2>&1 &
          emulator_pid=$!
          for _ in {1..60}; do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 8085), 1).close()"; then
              exit 0
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat /tmp/firestore.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/firestore.log
          exit 1
      - name: Test backend
        working-directory: backend
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          GOOGLE_CLOUD_PROJECT: invariantx-test
        run: pytest
      - name: Run safety evaluation
        working-directory: backend
        run: python -m app.evaluation --output /tmp/invariant-baseline.json

  backend-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Test backend
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_HOST: invariantx-api.onrender.com
        run: npm run build
      - name: Verify static export
        working-directory: frontend
        run: test -f out/index.html

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Render deployment
        run: |
          test ! -f backend/Dockerfile
          test ! -f frontend/Dockerfile
          ! grep -q "runtime: docker" render.yaml
          grep -q "runtime: python" render.yaml
          grep -q "runtime: static" render.yaml
