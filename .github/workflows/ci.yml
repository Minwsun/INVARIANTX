name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Test backend
        working-directory: backend
        run: pytest
      - name: Run safety evaluation
        working-directory: backend
        run: python -m app.evaluation --output /tmp/invariant-baseline.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_HOST: invariantx-api.onrender.com
        run: npm run build
      - name: Verify static export
        working-directory: frontend
        run: test -f out/index.html

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Render deployment
        run: |
          test ! -f backend/Dockerfile
          test ! -f frontend/Dockerfile
          ! grep -q "runtime: docker" render.yaml
          grep -q "runtime: python" render.yaml
          grep -q "runtime: static" render.yaml
